services:
  bridge:
    build: .
    ports:
      - "8786:8786"
    environment:
      BRIDGE_HOST: "0.0.0.0"
      BRIDGE_PORT: "8786"
      BRIDGE_SECRET: "${BRIDGE_SECRET:?set BRIDGE_SECRET}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://127.0.0.1:8786}"
      COLANODE_DATA_DIR: /data
      COLANODE_ASSETS_DIR: /app/vendor/colanode/assets
      SIDECAR_AUTO_START: "true"
      MCP_DNS_REBINDING_PROTECTION: "${MCP_DNS_REBINDING_PROTECTION:-false}"
    volumes:
      - bridge-data:/data
    restart: unless-stopped

volumes:
  bridge-data:
