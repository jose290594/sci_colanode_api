[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sci-colanode-api"
version = "0.0.1"
description = "SCI Marketing internal Colanode MCP/REST bridge (Python + Node sidecar)"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.0",
  "mcp>=1.6.0",
  "bcrypt>=4.1.0",
  "cryptography>=42.0.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9.0",
  "pytest>=8.0.0",
]

[project.scripts]
sci-colanode-api = "sci_colanode_api.main:run"
sci-colanode-mcp = "sci_colanode_api.mcp_stdio:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sci_colanode_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/sci_colanode_api/static" = "sci_colanode_api/static"

[tool.hatch.build.targets.sdist]
include = [
  "src/sci_colanode_api",
  "sidecar",
  "README.md",
  "LICENSE",
  "NOTICE",
]
